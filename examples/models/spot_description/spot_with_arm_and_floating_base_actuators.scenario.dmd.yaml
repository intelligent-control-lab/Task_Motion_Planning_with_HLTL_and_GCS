directives:
- add_model:
    name: spot
    file: package://drake_project/../Task_Motion_Planning/GCS_planning/models/spot_description/spot_with_arm_and_floating_base_actuators.urdf
    default_joint_positions:
        arm_sh1: [-3.1]
        arm_el0: [3.1]

# Add iiwa_1
- add_model:
    name: iiwa_1
    file: package://drake/manipulation/models/iiwa_description/urdf/iiwa14_spheres_collision.urdf

- add_frame:
    name: iiwa_1_origin
    X_PF:
      base_frame: world
      translation: [3, 1.5, 0.6]

- add_weld:
    parent: iiwa_1_origin
    child: iiwa_1::base
    
