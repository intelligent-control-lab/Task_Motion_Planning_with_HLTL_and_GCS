# Model directive for planar iiwa with simple collision and welded gripper

directives:

# Add iiwa_1
- add_model:
    name: iiwa_1
    file: package://drake/manipulation/models/iiwa_description/urdf/iiwa14_spheres_collision.urdf

- add_frame:
    name: iiwa_1_origin
    X_PF:
      base_frame: world
      translation: [0, 0, 0.56]

- add_weld:
    parent: iiwa_1_origin
    child: iiwa_1::base

# Add schunk_1
- add_model:
    name: wsg_1
    file: package://drake_project/../Task_Motion_Planning/GCS_planning/models/schunk_wsg_50_no_tip.sdf

- add_frame:
    name: iiwa_1::wsg_attach
    X_PF:
      base_frame: iiwa_1::iiwa_link_7
      translation: [0, 0, 0.1]
      rotation: !Rpy { deg: [90.0, 0.0, 90.0]}

- add_weld:
    parent: iiwa_1::wsg_attach
    child: wsg_1::body

# Add iiwa_2
- add_model:
    name: iiwa_2
    file: package://drake/manipulation/models/iiwa_description/urdf/iiwa14_spheres_collision.urdf

- add_frame:
    name: iiwa_2_origin
    X_PF:
      base_frame: world
      translation: [0, 2.2, 0.56]

- add_weld:
    parent: iiwa_2_origin
    child: iiwa_2::base

# Add schunk_2
- add_model:
    name: wsg_2
    file: package://drake_project/../Task_Motion_Planning/GCS_planning/models/schunk_wsg_50_no_tip.sdf

- add_frame:
    name: iiwa_2::wsg_attach
    X_PF:
      base_frame: iiwa_2::iiwa_link_7
      translation: [0, 0, 0.1]
      rotation: !Rpy { deg: [90.0, 0.0, 90.0]}

- add_weld:
    parent: iiwa_2::wsg_attach
    child: wsg_2::body

# Add conveyor
- add_model:
    name: conveyor_fixed
    file: package://drake_project/../Task_Motion_Planning_with_HLTL_and_GCS/examples/models/two_iiwa_conveyor/conveyor_description/conveyor.urdf

- add_frame:
    name: conveyor_origin
    X_PF:
      base_frame: world
      translation: [0.08, 0.4, 0]
      rotation: !Rpy { deg: [0, 0.0, -90.0 ]}

- add_weld:
    parent: conveyor_origin
    child: conveyor_fixed::table_base